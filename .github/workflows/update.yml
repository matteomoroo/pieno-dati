name: Aggiorna prezzi MIMIT e pubblica il sito

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pieno-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installazione pulita
        run: npm ci

      - name: Typecheck non bloccante
        run: npm run typecheck || echo "Typecheck con warning, proseguo."

      - name: Unit test
        run: npm test

      - name: Genera dataset
        run: npm run build

      - name: Costruisci il sito Astro
        run: npm run astro:build

      - name: Commit dello storico e dei dati generati
        run: |
          git config user.name  "pieno-bot"
          git config user.email "pieno-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei dati, niente commit."
          else
            git commit -m "dati: aggiornamento MIMIT $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Prepara l'artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
