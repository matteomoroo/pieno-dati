name: Aggiorna prezzi MIMIT e pubblica il sito

# Trigger: pianificato ogni mattina + manuale. NON su push, per evitare loop
# col commit automatico dello storico.
on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

# Permessi: scrivere il commit dello storico e pubblicare Pages.
permissions:
  contents: write # per committare public/data/**
  pages: write
  id-token: write

concurrency:
  group: pieno-update
  cancel-in-progress: false # non annullare a metà un commit dati

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installazione pulita
        run: npm ci

      # Il typecheck verifica i tipi ma NON blocca la pubblicazione per
      # eventuali warning minori: se fallisse, il sito non si aggiornerebbe.
      - name: Typecheck (non bloccante)
        run: npm run typecheck || echo "Typecheck con warning: proseguo comunque."

      - name: Unit test
        run: npm test

      # Se il MIMIT è irraggiungibile, cambia formato, o produce troppe poche
      # stazioni, la pipeline esce != 0 e il job fallisce QUI, PRIMA di
      # costruire o deployare: l'ultima versione valida resta intatta.
      - name: Genera dataset (schema v2)
        run: npm run build

      # Costruisce il sito Astro leggendo i dati appena generati in public/data.
      # Produce il sito statico in dist/.
      - name: Costruisci il sito Astro
        run: npm run astro:build

      - name: Commit dello storico e dei dati generati
        run: |
          git config user.name  "pieno-bot"
          git config user.email "pieno-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei dati: niente commit."
          else
            git commit -m "dati: aggiornamento MIMIT $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      # Pubblica il sito COSTRUITO (dist/), non più la cartella public/.
      - name: Prepara l'artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
