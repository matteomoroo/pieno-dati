name: Aggiorna prezzi MIMIT

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Genera stations.json e meta.json
        run: node scripts/build.mjs

      - name: Prepara l'artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
